[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
tag_format = "v$version"
changelog_file = "CHANGELOG.md"
update_changelog_on_bump = true
major_version_zero = true

[tool.commitizen.types]
feat = { description = "A new feature", changelog = true }
fix = { description = "A bug fix", changelog = true }
docs = { description = "Documentation only changes", changelog = true }
style = { description = "Changes that do not affect the meaning of the code", changelog = false }
refactor = { description = "A code change that neither fixes a bug nor adds a feature", changelog = false }
perf = { description = "A code change that improves performance", changelog = true }
test = { description = "Adding missing tests or correcting existing tests", changelog = false }
build = { description = "Changes that affect the build system or external dependencies", changelog = false }
ci = { description = "Changes to our CI configuration files and scripts", changelog = false }
chore = { description = "Other changes that don't modify src or test files", changelog = false }
revert = { description = "Reverts a previous commit", changelog = true }
